<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码管家 - Personal Password Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2D5A3D;
            --primary-light: #4A7C5F;
            --primary-dark: #1E3D2A;
            --accent: #E8B86D;
            --accent-light: #F5D9A0;
            --bg-cream: #FAF7F2;
            --bg-white: #FFFFFF;
            --bg-sand: #F0EBE0;
            --text-primary: #2C3E2D;
            --text-secondary: #5A6B5C;
            --text-muted: #8A9A8C;
            --danger: #C75D5D;
            --danger-light: #F5E0E0;
            --success: #4CAF50;
            --shadow-sm: 0 2px 8px rgba(45, 90, 61, 0.08);
            --shadow-md: 0 4px 20px rgba(45, 90, 61, 0.12);
            --shadow-lg: 0 8px 40px rgba(45, 90, 61, 0.16);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-cream);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(232, 184, 109, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(45, 90, 61, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(74, 124, 95, 0.06) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-white);
            color: var(--text-primary);
            border: 2px solid var(--bg-sand);
        }

        .btn-secondary:hover {
            border-color: var(--primary-light);
            background: var(--bg-cream);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* Search */
        .search-box {
            position: relative;
            width: 44px;
            height: 44px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            flex-shrink: 0;
        }
        .search-box.active {
            flex-grow: 1; /* 占据剩余空间 */
            width: auto;
        }
        .search-box input {
            width: 100%;
            height: 100%;
            padding: 10px 15px 10px 45px;
            border: 2px solid var(--bg-sand);
            border-radius: var(--radius-lg);
            background: var(--bg-white);
            opacity: 0;
            cursor: pointer;
            transition: opacity  0.3s;
        }

        .search-box.active input {
            opacity: 1;
            border-color: var(--primary-light);
            cursor: text;
        }
		
		.search-box input:focus {
			outline: none;
			border-color: var(--primary-light);
		}

        .search-box svg {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            z-index: 2;
            cursor: pointer;
        }

        /* Password List */
        .password-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .password-item {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s ease;
            animation: fadeInUp 0.4s ease-out both;
        }

        .password-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .password-item:nth-child(1) { animation-delay: 0.05s; }
        .password-item:nth-child(2) { animation-delay: 0.1s; }
        .password-item:nth-child(3) { animation-delay: 0.15s; }
        .password-item:nth-child(4) { animation-delay: 0.2s; }
        .password-item:nth-child(5) { animation-delay: 0.25s; }

        .favicon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .password-info {
            flex: 1;
            min-width: 0;
        }

        .password-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-title a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .password-title a:hover {
            color: var(--accent);
        }

        .password-username {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .password-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--bg-sand);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        .icon-btn:hover {
            background: var(--primary-light);
        }

        .icon-btn:hover svg {
            fill: white;
        }

        .icon-btn.danger:hover {
            background: var(--danger);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            fill: var(--bg-sand);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
            scrollbar-width: none;
            scrollbar-color: var(--primary-light) var(--bg-sand);
        }

        .modal::-webkit-scrollbar {
            width: 8px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }
        .modal::-webkit-scrollbar-track {
            background: var(--bg-sand);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal h2 {
            font-size: 1.4rem;
            margin-bottom: 24px;
            color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--bg-sand);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.25s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-input-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
            fill: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions .btn {
            flex: 1;
            justify-content: center;
        }

        /* Password Generator */
        .generator-section {
            background: var(--bg-sand);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-top: 24px;
        }

        .generator-section h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .generator-section h3 svg {
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }

        .generated-password {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 16px;
            border: 2px dashed var(--primary-light);
            color: var(--primary-dark);
            word-break: break-all;
        }

        .generator-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 14px;
            background: var(--bg-white);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .checkbox-label:hover {
            background: var(--primary-light);
            color: white;
        }

        .checkbox-label input {
            display: none;
        }

        .checkbox-label input:checked + span {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-label input:checked + span svg {
            opacity: 1;
        }

        .checkbox-label span {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .checkbox-label span svg {
            width: 14px;
            height: 14px;
            fill: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .length-slider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .length-slider input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: var(--bg-white);
            border-radius: 3px;
            outline: none;
        }

        .length-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .length-value {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            color: var(--primary);
        }

        /* Import/Export */
        .import-export-modal .modal {
            max-width: 520px;
        }

        .export-textarea {
            width: 100%;
            height: 200px;
            padding: 14px 16px;
            border: 2px solid var(--bg-sand);
            border-radius: var(--radius-md);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            resize: vertical;
            margin-bottom: 16px;
        }

        .export-textarea:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 40px 20px;
            background: var(--bg-sand);
            border: 2px dashed var(--primary-light);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            transition: all 0.25s ease;
        }

        .file-input-wrapper:hover .file-input-label {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary);
        }

        .file-input-label svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary-dark);
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-lg);
            font-size: 0.95rem;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Copy Button Animation */
        .copy-btn.copied {
            background: var(--success);
        }

        .copy-btn.copied svg {
            fill: white;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 10px 2vw;
            }
            h1 {
                font-size: 1.2rem;
            }
            .action-bar {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr auto;
            }
            .search-box.active {
                grid-column: 1 / -1; /* 展开时独占一行 */
                margin-top: 8px;
            }
            .btn {
                width: 100%;
                justify-content: center;
                font-size: 1rem;
                padding: 12px 0;
            }
            .password-item {
                flex-wrap: wrap;
                padding: 14px 8px;
            }
            .password-info {
                order: 2;
                width: 100%;
                min-width: 0;
            }
            .password-actions {
                order: 3;
                width: 100%;
                justify-content: flex-end;
                margin-top: 12px;
            }
            .modal {
                padding: 16px 6px;
                max-width: 98vw;
                min-width: 0;
            }
            .generator-section {
                padding: 12px 4px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-sand);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <h1>密码管家</h1>
            </div>
            <p class="subtitle">安全、简洁、高效的密码管理</p>
        </header>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="openModal('add')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                新增密码
            </button>
            <button class="btn btn-secondary" onclick="openExportModal()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                导出
            </button>
            <button class="btn btn-secondary" onclick="openImportModal()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                导入
            </button>
        <div class="search-box" onclick='toggleSearch(true)'>
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="搜索网站、账号..." oninput="filterPasswords()" onblur="toggleSearch(false)">
        </div>
        </div>

        <div class="password-list" id="passwordList">
            <!-- Password items will be rendered here -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <h2 id="modalTitle">新增密码</h2>
            <form id="passwordForm" onsubmit="savePassword(event)">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-group">
                    <label>网站名称 *</label>
                    <input type="text" id="siteName" required placeholder="例如：Google、GitHub">
                </div>
                <div class="form-group">
                    <label>网站链接</label>
                    <input type="url" id="url" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>账号 *</label>
                    <input type="text" id="username" required placeholder="用户名或邮箱">
                </div>
                <div class="form-group">
                    <label>密码 *</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" required placeholder="请输入密码">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="notes" placeholder="添加备注信息..."></textarea>
                </div>

                <!-- Password Generator -->
                <div class="generator-section">
                    <h3>
                        <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
                        密码生成器
                    </h3>
                    <div class="generated-password" id="generatedPassword">点击生成</div>
                    <div class="length-slider">
                        <span>长度：</span>
                        <input type="range" id="passwordLength" min="6" max="32" value="16" oninput="updateLengthDisplay()">
                        <span class="length-value" id="lengthValue">16</span>
                    </div>
                    <div class="generator-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="useNumbers" checked>
                            <span><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
                            数字
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="useUppercase" checked>
                            <span><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
                            大写字母
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="useLowercase" checked>
                            <span><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
                            小写字母
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="useSpecial">
                            <span><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
                            特殊符号
                        </label>
                    </div>
                    <button type="button" class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="generatePassword()">
                        <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.53 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        生成随机密码
                    </button>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay import-export-modal" id="exportModal">
        <div class="modal">
            <h2>导出密码</h2>
            <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 0.9rem;">密码数据已下载，请妥善保存：</p>
            <textarea class="export-textarea" id="exportData" readonly></textarea>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="copyExportData()">复制数据</button>
                <button type="button" class="btn btn-primary" onclick="closeExportModal()">完成</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal-overlay import-export-modal" id="importModal">
        <div class="modal">
            <h2>导入密码</h2>
            <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 0.9rem;">请粘贴之前导出的密码数据：</p>
            <textarea class="export-textarea" id="importData" placeholder="在此粘贴数据..."></textarea>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeImportModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="importPasswords()">导入</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Data storage
        let passwords = JSON.parse(localStorage.getItem('passwords')) || [];

        // Render passwords
        function getFaviconHtml(url, siteName) {
            if (url) {
                try {
                    let u = new URL(url);
                    let domain = u.hostname;
                    return `<img src="https://www.google.com/s2/favicons?sz=48&domain=${domain}" alt="icon" style="width:44px;height:44px;border-radius:12px;background:#eee;object-fit:cover;box-shadow:0 1px 4px #0001;">`;
                } catch {
                    // fallback
                }
            }
            const initial = siteName.charAt(0).toUpperCase();
            return `<div class="favicon">${initial}</div>`;
        }

		function toggleSearch(expand) {
			const container = document.querySelector('.search-box');
			const input = document.getElementById('searchInput');
			
			if (expand) {
				container.classList.add('active');
				input.focus();
			} else {
				// 如果输入框没内容，则收起
				if (input.value.trim() === "") {
					container.classList.remove('active');
				}
			}
		}

        function renderPasswords() {
            const list = document.getElementById('passwordList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = passwords.filter(p => 
                p.siteName.toLowerCase().includes(searchTerm) || 
                p.username.toLowerCase().includes(searchTerm)
            );
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                        <h3>${passwords.length === 0 ? '还没有密码记录' : '没有找到匹配的密码'}</h3>
                        <p>${passwords.length === 0 ? '点击\"新增密码\"开始添加' : '尝试其他搜索词'}</p>
                    </div>
                `;
                return;
            }
            list.innerHTML = filtered.map((p, index) => {
                const url = p.url || '';
                const favicon = getFaviconHtml(url, p.siteName);
                const siteLink = url ? `<a href="${url}" target="_blank" title="打开网站">${escapeHtml(p.siteName)}</a>` : escapeHtml(p.siteName);
                return `
                    <div class="password-item">
                        ${favicon}
                        <div class="password-info">
                            <div class="password-title">${siteLink}</div>
                            <div class="password-username">${escapeHtml(p.username)}</div>
                            ${p.notes ? `<div class="password-username" style="font-size:0.8rem;color:var(--text-muted)">${escapeHtml(p.notes.substring(0, 30))}${p.notes.length > 30 ? '...' : ''}</div>` : ''}
                            <div class="password-username" style="font-size:0.8rem;color:var(--text-muted)">创建时间：${p.createdAt ? escapeHtml(p.createdAt) : ''}</div>
                        </div>
                        <div class="password-actions">
                            <button class="icon-btn copy-btn" onclick="copyPassword('${escapeHtml(p.password).replace(/'/g, "\\'")}')" title="复制密码">
                                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            </button>
                            <button class="icon-btn" onclick="editPassword(${index})" title="编辑">
                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            </button>
                            <button class="icon-btn danger" onclick="deletePassword(${index})" title="删除">
                                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Filter passwords
        function filterPasswords() {
			renderPasswords();
        }

        // Modal functions
        function openModal(mode, index = -1) {
            const modal = document.getElementById('passwordModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('passwordForm');
            if (mode === 'add') {
                title.textContent = '新增密码';
                form.reset();
                document.getElementById('editIndex').value = -1;
                // 清空生成器内容
                document.getElementById('generatedPassword').textContent = '点击生成';
            } else {
                title.textContent = '编辑密码';
                const p = passwords[index];
                document.getElementById('editIndex').value = index;
                document.getElementById('siteName').value = p.siteName;
                document.getElementById('url').value = p.url || '';
                document.getElementById('username').value = p.username;
                document.getElementById('password').value = p.password;
                document.getElementById('notes').value = p.notes || '';
                document.getElementById('generatedPassword').textContent = '点击生成';
            }
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        // Save password
        function savePassword(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            let passwordData = {
                siteName: document.getElementById('siteName').value,
                url: document.getElementById('url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                notes: document.getElementById('notes').value,
            };
            if (index === -1) {
                passwordData.createdAt = dateStr;
                passwords.push(passwordData);
                showToast('密码添加成功！');
            } else {
                // 保留原有创建时间
                passwordData.createdAt = passwords[index].createdAt || dateStr;
                passwords[index] = passwordData;
                showToast('密码更新成功！');
            }
            saveToStorage();
            renderPasswords();
            closeModal();
        }

        // Edit password
        function editPassword(index) {
            openModal('edit', index);
        }

        // Delete password
        function deletePassword(index) {
            if (confirm('确定要删除这个密码记录吗？')) {
                passwords.splice(index, 1);
                saveToStorage();
                renderPasswords();
                showToast('密码已删除');
            }
        }

        // Copy password
        function copyPassword(pwd) {
            navigator.clipboard.writeText(pwd).then(() => {
                showToast('密码已复制到剪贴板');
            }).catch(() => {
                showToast('复制失败，请手动复制');
            });
        }

        // Toggle password visibility
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        // Password generator
        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const useNumbers = document.getElementById('useNumbers').checked;
            const useUppercase = document.getElementById('useUppercase').checked;
            const useLowercase = document.getElementById('useLowercase').checked;
            const useSpecial = document.getElementById('useSpecial').checked;

            let chars = '';
            if (useNumbers) chars += '0123456789';
            if (useUppercase) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLowercase) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useSpecial) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) {
                showToast('请至少选择一种字符类型');
                return;
            }

            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }

            document.getElementById('generatedPassword').textContent = password;
            document.getElementById('password').value = password;
        }

        function updateLengthDisplay() {
            document.getElementById('lengthValue').textContent = document.getElementById('passwordLength').value;
        }

        // Export/Import
        function openExportModal() {
            if (passwords.length === 0) {
                showToast('没有密码可导出');
                return;
            }
            document.getElementById('exportData').value = '';
            document.getElementById('exportModal').classList.add('active');
            // 自动下载json文件
            const blob = new Blob([JSON.stringify(passwords, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'passwords.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        function copyExportData() {
            showToast('请使用导出下载的json文件');
        }

        function openImportModal() {
            document.getElementById('importData').value = '';
            document.getElementById('importModal').classList.add('active');
            // 添加文件选择
            if (!document.getElementById('importFileInput')) {
                const wrapper = document.createElement('div');
                wrapper.className = 'file-input-wrapper';
                wrapper.innerHTML = `
                    <label class="file-input-label">
                        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        选择json文件导入
                        <input type="file" id="importFileInput" accept="application/json">
                    </label>
                `;
                const modal = document.getElementById('importModal').querySelector('.modal');
                modal.insertBefore(wrapper, modal.querySelector('.export-textarea'));
                document.getElementById('importFileInput').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        document.getElementById('importData').value = evt.target.result;
                    };
                    reader.readAsText(file);
                });
            }
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.remove('active');
        }

        function importPasswords() {
            const data = document.getElementById('importData').value.trim();
            if (!data) {
                showToast('请输入要导入的数据或选择json文件');
                return;
            }
            try {
                const imported = JSON.parse(data);
                if (!Array.isArray(imported)) {
                    throw new Error('Invalid data format');
                }
                // Validate data
                const valid = imported.every(p => p.siteName && p.username && p.password);
                if (!valid) {
                    throw new Error('Invalid password data');
                }
                if (confirm(`确定要导入 ${imported.length} 条密码记录吗？`)) {
                    passwords = [...passwords, ...imported];
                    saveToStorage();
                    renderPasswords();
                    closeImportModal();
                    showToast(`成功导入 ${imported.length} 条密码`);
                }
            } catch (e) {
                showToast('导入失败，数据格式错误');
            }
        }

        // Storage
        function saveToStorage() {
            localStorage.setItem('passwords', JSON.stringify(passwords));
        }

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Close modal on overlay click
        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('exportModal').addEventListener('click', function(e) {
            if (e.target === this) closeExportModal();
        });

        document.getElementById('importModal').addEventListener('click', function(e) {
            if (e.target === this) closeImportModal();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeExportModal();
                closeImportModal();
            }
        });

        // Initial render
        renderPasswords();
    </script>
</body>
</html>
