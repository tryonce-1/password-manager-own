<style>

.btn:hover{border-color:#b9c2d0;background:#f8f9fb}
.btn:active{box-shadow:none;transform:translateY(1px)}

.btn-green:hover,.btn-dark:hover{background:#343a46;border-color:#343a46;color:#fff}

.icon-btn:hover{color:var(--ink);background:#f8f9fb;border-color:#b9c2d0}
.copy-btn,.copy-btn:hover{background:#EAF0FE;border-color:#CBD5F4;color:#2456D8}
.modal h2{margin-bottom:4px;font-weight:600;font-size:1.12rem}
:root{--mono:ui-monospace,'JetBrains Mono',Menlo,monospace;--serif:'Noto Serif SC',serif;color-scheme:light;--bg:#f7f7f5;--card:#ffffff;--line:#dedfdf;--line2:#ececea;--ink:#1b1d21;--sub:#62666e;--mut:#858b94;--zed:#1749d8;--zed-d:#103bb8;--green:#1749d8;--danger:#b94545}
body::before{content:'';position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);pointer-events:none;width:min(100%,900px);max-width:calc(100% - 32px);mask-image:linear-gradient(180deg,#000 0,#000 300px,transparent 520px);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 300px,transparent 520px);background:linear-gradient(90deg,rgba(40,46,58,.1) 1px,transparent 1px) left top/1px 100% no-repeat,
    linear-gradient(90deg,rgba(40,46,58,.1) 1px,transparent 1px) right top/1px 100% no-repeat,
    repeating-linear-gradient(180deg,rgba(40,46,58,.1) 0 1px,transparent 1px 7px) left top/9px 270px no-repeat,
    repeating-linear-gradient(180deg,rgba(40,46,58,.1) 0 1px,transparent 1px 7px) right top/9px 270px no-repeat}
.wrap::before,.wrap::after{content:'';position:absolute;top:0;bottom:0;width:1px;background:rgba(40,46,58,.1)}
.top,.bar{position:relative;border-bottom:1px solid var(--line)}
.top::after,.bar::after{content:'';position:absolute;left:calc((900px - 100vw)/2 - 40px);right:calc((900px - 100vw)/2 - 40px);bottom:-1px;height:1px;background:var(--line);pointer-events:none;z-index:0}
.top::before,.bar::before{content:'';position:absolute;left:calc((900px - 100vw)/2 - 40px);right:calc((900px - 100vw)/2 - 40px);bottom:-4px;height:8px;background:radial-gradient(circle,var(--bg) 0 2px,#aeb5c0 2px 3px,transparent 3.5px) calc(50% - 450px) center/8px 8px no-repeat,
    radial-gradient(circle,var(--bg) 0 2px,#aeb5c0 2px 3px,transparent 3.5px) calc(50% + 450px) center/8px 8px no-repeat;pointer-events:none;z-index:1}
.mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #d3daf0;border-radius:7px;box-shadow:none;background:#f2f5ff;border-color:#d3daf0}
.mark svg{width:17px;height:17px;fill:var(--zed)}
.brand small,.hint,.password-meta{color:var(--mut)}
.n,.btn,.search,.password-list,.icon-btn,.modal,.form-group input,.form-group textarea,.export-textarea,.generated-password,.checkbox-label,.file-input-label{border-color:var(--line);background:var(--card);color:var(--ink)}
.n{font-size:.78rem;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);padding:7px 10px;background:rgba(255,255,255,.78);color:var(--sub)}
.n b,.password-title{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--ink);white-space:nowrap;padding:8px 12px;transition:background-color .16s,border-color .16s,color .16s,transform .16s;min-height:40px;box-shadow:none}
.btn:hover,.icon-btn:hover{background:#f1f3f7;border-color:#b9c2d0;color:var(--ink)}
.btn-zed,.btn-green{box-shadow:none;background:var(--zed);border-color:var(--zed);color:#fff}
.btn-zed:hover,.btn-green:hover{background:var(--zed-d);border-color:var(--zed-d);color:#fff}
.btn-dark{background:#20242c;border-color:#20242c;color:#fff}
.btn-dark:hover{background:#343a46;border-color:#343a46;color:#fff}

.btn-zed .key{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.bar{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:0;padding:16px 0;border-bottom-color:var(--line)}
.search{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:0 11px;min-height:42px;background:rgba(255,255,255,.88);border-color:var(--line);box-shadow:none}

.search svg{width:16px;height:16px;flex-shrink:0;fill:var(--mut)}
#searchInput{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:.9rem;min-width:0;height:40px;color:var(--ink)}
#searchInput::placeholder,.form-group input::placeholder,.form-group textarea::placeholder,.export-textarea::placeholder{color:#7d838c}
.password-item{background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;display:flex;align-items:center;transition:.12s;position:relative;min-height:70px;padding:14px 16px;gap:14px;border-bottom-color:var(--line2)}
.password-item:hover{background:#f7f8fb}
.password-item::before{content:'';position:absolute;left:0;opacity:0;top:0;bottom:0;width:3px;background:var(--zed)}
.password-item img{width:32px;height:32px;border-radius:7px;flex-shrink:0;border:1px solid var(--line2);object-fit:cover;background:#f0f2f6;border-color:var(--line)}
.favicon.fav-link{background:#EAF0FE;border-color:#CBD5F4;color:#2456D8}
.favicon.fav-nolink{background:#F0F2F6;border-color:var(--line);color:#68707D}
.password-username{font-size:.79rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;color:var(--sub)}
.password-title a:hover{color:var(--zed)}
.icon-btn{min-width:30px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:inherit;font-size:.78rem;color:var(--sub);transition:.12s;height:32px;border-color:#dfe2e7;min-height:38px;box-shadow:none}
.copy-btn{background:#EAF0FE!important;border-color:#CBD5F4!important;color:#2456D8!important}
.copy-btn:hover{background:#DCE6FD!important;border-color:#B4C6F5!important;color:#1744BF!important}
.icon-btn.danger:hover{color:var(--danger);border-color:#e5c1c1;background:#fff7f7}
.empty{text-align:center;padding:62px 20px;color:var(--mut)}
.empty h3{margin:12px 0 4px;font-size:.98rem;font-weight:600;color:var(--ink)}
.modal-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;visibility:hidden;transition:.2s;padding:16px;background:rgba(23,28,37,.5);backdrop-filter:blur(4px)}
.modal{border:1px solid var(--line);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;transform:translateY(8px);transition:.2s;border-radius:8px;padding:26px;background:#fff;border-color:var(--line);box-shadow:0 24px 80px rgba(16,24,40,.18)}
.modal .sub{font-family:var(--mono);font-size:.72rem;margin-bottom:18px;letter-spacing:1.4px;color:var(--mut)}
.form-group label{display:block;font-size:.83rem;margin-bottom:6px;color:var(--sub)}
.form-group input,.form-group textarea,.export-textarea{border-color:var(--line);border-radius:5px;background:#fbfbfc;color:var(--ink)}
.form-group input:focus,.form-group textarea:focus,.export-textarea:focus{outline:0;border-color:var(--zed);box-shadow:0 0 0 3px rgba(23,73,216,.1)}
.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:0;border:0;cursor:pointer;padding:5px;color:var(--sub)}
.generator h3{font-size:.9rem;margin-bottom:12px;color:var(--ink)}
.generated-password{border:1px solid var(--line);padding:12px;font-family:var(--mono);font-size:.95rem;text-align:center;word-break:break-all;margin-bottom:12px;min-height:48px;border-radius:5px;background:#fff;color:var(--ink);overflow-wrap:anywhere}
.length-slider,.checkbox-label{color:var(--sub)}
.checkbox-label{display:flex;align-items:center;gap:7px;font-size:.82rem;padding:7px 11px;border:1px solid var(--line);cursor:pointer;border-radius:5px;background:#fff;position:relative}
.checkbox-label span{width:15px;height:15px;border:1px solid #B9C4BC;border-radius:4px;display:grid;place-items:center;border-color:#aeb5bf}
.checkbox-label input:checked+span{background:var(--zed);border-color:var(--zed)}
.checkbox-label input:checked+span svg{opacity:1;fill:#fff}
.checkbox-label input{display:block;position:absolute;width:1px;height:1px;opacity:0}
.checkbox-label:focus-within{outline:2px solid var(--zed);outline-offset:2px}
.file-input-label{display:flex;align-items:center;justify-content:center;gap:8px;padding:28px 14px;border:1px dashed #CBD5CD;font-size:.86rem;margin-bottom:12px;cursor:pointer;position:relative;border-radius:5px;background:#f7f8fa;border-color:#cbd1db;color:var(--sub)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);padding:11px 20px;font-size:.86rem;opacity:0;transition:.25s;z-index:99;border-radius:5px;background:#e7edf5;color:#15191e}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--zed);outline-offset:3px}
html,body{height:100%;overflow:hidden!important}
body{font-family:'Outfit','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased;background-color:var(--bg);background-image:radial-gradient(rgba(55,65,81,.055) .65px,transparent .65px);background-size:8px 8px;background:var(--bg);color:var(--ink);display:flex!important;flex-direction:column!important;min-height:100vh;align-items:center}
.wrap{margin:0 auto;position:relative;max-width:900px;padding:0 40px 76px;flex:1!important;min-height:0!important;width:100%!important;display:flex!important;flex-direction:column!important;padding-bottom:24px!important}
.top,.bar,.hint{flex-shrink:0!important}
.password-list{display:flex;flex-direction:column;border:1px solid var(--line);overflow:hidden;border-color:var(--line);border-radius:6px;background:var(--card);box-shadow:none;flex:1!important;min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}

.password-list::-webkit-scrollbar-thumb{background:transparent}
.password-list::-webkit-scrollbar-track{background:transparent}
.float-field{position:relative;margin-bottom:14px}
.float-field input{width:100%;padding:18px 13px 8px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:.92rem;background:#fbfbfc;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.float-field input::placeholder{color:transparent}
.float-field label{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.92rem;color:#7d838c;pointer-events:none;transition:top .15s,font-size .15s,color .15s,padding .15s;background:transparent;padding:0 4px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.float-field input:focus{outline:0;border-color:var(--zed);box-shadow:0 0 0 3px rgba(23,73,216,.1)}
.float-field input:focus+label,.float-field input:not(:placeholder-shown)+label,.float-field input:-webkit-autofill+label{top:0;font-size:.72rem;color:var(--sub);background:#fff;padding:0 6px}
.float-field input:focus+label{color:var(--zed)}
.float-field .toggle-password{position:absolute;right:6px;bottom:3px;top:auto;transform:none;width:32px;height:32px;display:grid;place-items:center;background:0;border:0;cursor:pointer;padding:0;color:var(--sub)}
.float-field .password-input-wrapper{position:static}
.float-field.has-eye input{padding-right:42px}
.float-field .toggle-password svg{width:19px;height:19px;fill:currentColor}
.generator{border:1px solid var(--line2);margin-top:16px;border-radius:6px;background:#f5f6f8;border-color:#e2e5e9;padding:0!important;overflow:hidden}
.generator-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;cursor:pointer;padding:14px 16px;font-family:inherit;font-size:.9rem;font-weight:600;color:var(--ink)}
.generator-head .gen-arrow{width:18px;height:18px;fill:currentColor;color:var(--mut);transition:transform .38s cubic-bezier(.32,.72,.28,1);flex-shrink:0}

.generator.open .generator-body{grid-template-rows:1fr;opacity:1}
.generator-body-inner{overflow:hidden;min-height:0;transform:translateY(-10px);transition:transform .45s cubic-bezier(.32,.72,.28,1)}
.generator.open .generator-body-inner{transform:translateY(0)}
.generator-body-inner-pad{padding-bottom:16px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

.password-actions{grid-column:2;width:100%;justify-content:flex-start;gap:6px;order:initial}
.wrap{padding:0 16px 16px!important}
.wrap::before{left:16px}
.wrap::after{right:16px}
.top::before,.top::after,.bar::before,.bar::after,.hint::before,.hint::after{left:-16px;right:-16px}
.top::before,.bar::before,.hint::before{background-position:left 12px center,right 12px center}
.top{align-items:center;flex-wrap:wrap;padding:14px 0}
.top-actions{width:auto;justify-content:flex-end;flex-wrap:wrap}
.bar{flex-wrap:wrap}
.bar .search{flex:1 1 100%}
.bar .btn{margin-left:auto}
body .password-item{display:flex!important;flex-wrap:wrap!important;align-items:flex-start!important;height:auto!important;min-height:0!important;gap:10px 12px;padding:13px 12px}
body .password-item .favicon{flex-shrink:0!important;align-self:flex-start}

body .password-title,body .password-username{white-space:normal!important;overflow-wrap:anywhere}

.modal{padding:20px}}
</style>
</head>

<div class="wrap">

<div class="float-field"><input id="username" required placeholder="账号 *"><label>账号 *</label></div>
<div class="float-field has-eye"><input type="password" id="password" required placeholder="密码 *"><label>密码 *</label><button type="button" class="toggle-password" onclick="togglePasswordVisibility()"><svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></button></div>
<div class="form-group"><textarea id="notes" placeholder="备注..."></textarea></div>
<div class="generator" id="generatorBox">
<button type="button" class="generator-head" onclick="toggleGenerator()">密码生成器<svg class="gen-arrow" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
<div class="generator-body">
<div class="generator-body-inner"><div class="generator-body-inner-pad">
<div class="generated-password" id="generatedPassword">点击生成</div>
<div class="length-slider"><span>长度</span><input type="range" id="passwordLength" min="6" max="32" value="16" oninput="updateLengthDisplay()"><span class="length-value" id="lengthValue">16</span></div>
<div class="generator-options">
<label class="checkbox-label"><input type="checkbox" id="useNumbers" checked><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>数字</label>
<label class="checkbox-label"><input type="checkbox" id="useUppercase" checked><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>大写</label>
<label class="checkbox-label"><input type="checkbox" id="useLowercase" checked><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>小写</label>
<label class="checkbox-label"><input type="checkbox" id="useSpecial"><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>符号</label>
</div>
<button type="button" class="btn" style="width:100%;justify-content:center" onclick="generatePassword()">生成随机密码</button>
</div></div>
</div>
</div>
<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-green">保存</button></div>
</form>
</div></div>
<div class="modal-overlay import-export-modal" id="exportModal"><div class="modal">
<h2>导出密码</h2>
<div class="sub">EXPORT — JSON</div>
<p style="color:var(--sub);margin-bottom:12px;font-size:.86rem">密码数据已下载，请妥善保存：</p>
<textarea class="export-textarea" id="exportData" readonly></textarea>
<div class="modal-actions"><button type="button" class="btn" onclick="copyExportData()">复制数据</button><button type="button" class="btn btn-dark" onclick="closeExportModal()">完成</button></div>
</div></div>
<div class="modal-overlay import-export-modal" id="importModal"><div class="modal">
<h2>导入密码</h2>
<div class="sub">IMPORT — JSON</div>
<p style="color:var(--sub);margin-bottom:12px;font-size:.86rem">请粘贴之前导出的密码数据：</p>
<textarea class="export-textarea" id="importData" placeholder="在此粘贴数据..."></textarea>
<div class="modal-actions"><button type="button" class="btn" onclick="closeImportModal()">取消</button><button type="button" class="btn btn-green" onclick="importPasswords()">导入</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
let passwords=JSON.parse(localStorage.getItem('passwords'))||[];
function getFaviconHtml(url,siteName){let hasLink=false;if(url&&String(url).trim()){try{let u=new URL(String(url).trim());if(u.hostname)hasLink=true}catch(e){hasLink=false}}if(hasLink){return '<div class="favicon fav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.9 5.7 3.9 9s-1.4 6.4-3.9 9c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg></div>'}return '<div class="favicon fav-nolink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.2" fill="currentColor" stroke="none"/></svg></div>'}
function renderPasswords(){let list=document.getElementById('passwordList');let q=document.getElementById('searchInput').value.toLowerCase();let f=passwords.map((p,i)=>({p:p,i:i})).filter(x=>x.p.siteName.toLowerCase().includes(q)||x.p.username.toLowerCase().includes(q));document.getElementById('totalCount').textContent=passwords.length;document.getElementById('listHint').textContent=f.length+' 项';if(f.length===0){list.innerHTML='<div class="empty"><h3>'+(passwords.length===0?'还没有密码':'没有匹配结果')+'</h3><p>'+(passwords.length===0?'点击新增，添加第一条':'换个关键词试试')+'</p><button class="btn btn-zed" onclick="openModal(\'add\')">+ 新增密码</button></div>';return}
list.innerHTML=f.map(x=>{let p=x.p;let index=x.i;let fav=getFaviconHtml(p.url||'',p.siteName);let name=p.url?'<a href="'+p.url+'" target="_blank">'+escapeHtml(p.siteName)+'</a>':escapeHtml(p.siteName);let notes=p.notes?'<div class="password-username">'+escapeHtml(p.notes.substring(0,30))+'</div>':'';let svgCopy='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';let svgEdit='<svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';let svgDel='<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';return '<div class="password-item">'+fav+'<div class="password-info"><div class="password-title">'+name+'</div><div class="password-username">'+escapeHtml(p.username)+'</div>'+notes+'<div class="password-meta">'+escapeHtml(formatDate(p.createdAt))+'</div></div><div class="password-actions"><button class="icon-btn copy-btn" title="复制" data-pwd="'+encodeURIComponent(p.password||'')+'" onclick="copyPassword(this)">'+svgCopy+'</button><button class="icon-btn" title="编辑" onclick="editPassword('+index+')">'+svgEdit+'</button><button class="icon-btn danger" title="删除" onclick="deletePassword('+index+')">'+svgDel+'</button></div></div>'}).join('')}
function escapeHtml(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}
function formatDate(v){if(!v)return '';let s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');let d=new Date(s);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return s}
function filterPasswords(){renderPasswords()}
function openModal(mode,index=-1){let m=document.getElementById('passwordModal');let t=document.getElementById('modalTitle');let f=document.getElementById('passwordForm');if(mode==='add'){t.textContent='新增密码';f.reset();document.getElementById('editIndex').value=-1;document.getElementById('generatedPassword').textContent='点击生成'}else{t.textContent='编辑密码';let p=passwords[index];document.getElementById('editIndex').value=index;document.getElementById('siteName').value=p.siteName;document.getElementById('url').value=p.url||'';document.getElementById('username').value=p.username;document.getElementById('password').value=p.password;document.getElementById('notes').value=p.notes||'';document.getElementById('generatedPassword').textContent='点击生成'}m.classList.add('active')}
function closeModal(){document.getElementById('passwordModal').classList.remove('active')}
function savePassword(e){e.preventDefault();let i=parseInt(document.getElementById('editIndex').value);let n=new Date();let ds=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');let d={siteName:document.getElementById('siteName').value,url:document.getElementById('url').value,username:document.getElementById('username').value,password:document.getElementById('password').value,notes:document.getElementById('notes').value};if(i===-1){d.createdAt=ds;passwords.push(d);showToast('已添加')}else{d.createdAt=passwords[i].createdAt||ds;passwords[i]=d;showToast('已更新')}saveToStorage();renderPasswords();closeModal()}
function editPassword(i){openModal('edit',i)}
function deletePassword(i){if(confirm('确定删除这条记录吗？')){passwords.splice(i,1);saveToStorage();renderPasswords();showToast('已删除')}}
function copyPassword(a,b){let pwd='';if(a&&a.getAttribute&&a.hasAttribute('data-pwd')){pwd=decodeURIComponent(a.getAttribute('data-pwd')||'')}else if(typeof a==='string'){pwd=a}else{pwd=b||''}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(pwd).then(()=>{showToast('已复制')}).catch(()=>{fallbackCopy(pwd)})}else{fallbackCopy(pwd)}}
function fallbackCopy(t){try{let ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('已复制')}catch(e){showToast('复制失败')}}
function togglePasswordVisibility(){let i=document.getElementById('password');i.type=i.type==='password'?'text':'password'}
function toggleGenerator(){document.getElementById('generatorBox').classList.toggle('open')}
function generatePassword(){let len=parseInt(document.getElementById('passwordLength').value);let c='';if(document.getElementById('useNumbers').checked)c+='0123456789';if(document.getElementById('useUppercase').checked)c+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(document.getElementById('useLowercase').checked)c+='abcdefghijklmnopqrstuvwxyz';if(document.getElementById('useSpecial').checked)c+='!@#$%^&*()_+-=[]{}|;:,.<>?';if(!c){showToast('至少选一种字符');return}let s='';let a=new Uint32Array(len);crypto.getRandomValues(a);for(let k=0;k<len;k++)s+=c[a[k]%c.length];document.getElementById('generatedPassword').textContent=s;document.getElementById('password').value=s}
function updateLengthDisplay(){document.getElementById('lengthValue').textContent=document.getElementById('passwordLength').value}
function openExportModal(){if(!passwords.length){showToast('没有可导出的数据');return}document.getElementById('exportData').value='';document.getElementById('exportModal').classList.add('active');let b=new Blob([JSON.stringify(passwords,null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let x=document.createElement('a');x.href=u;x.download='passwords.json';document.body.appendChild(x);x.click();setTimeout(()=>{document.body.removeChild(x);URL.revokeObjectURL(u)},100)}
function closeExportModal(){document.getElementById('exportModal').classList.remove('active')}
function copyExportData(){showToast('请使用下载的json文件')}
function openImportModal(){document.getElementById('importData').value='';document.getElementById('importModal').classList.add('active');if(!document.getElementById('importFileInput')){let w=document.createElement('div');w.className='file-input-wrapper';w.innerHTML='<label class="file-input-label">选择 json 文件导入<input type="file" id="importFileInput" accept="application/json"></label>';let m=document.getElementById('importModal').querySelector('.modal');m.insertBefore(w,m.querySelector('.export-textarea'));document.getElementById('importFileInput').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){document.getElementById('importData').value=ev.target.result};r.readAsText(f)})}}
function closeImportModal(){document.getElementById('importModal').classList.remove('active')}
function importPasswords(){let d=document.getElementById('importData').value.trim();if(!d){showToast('请粘贴数据或选择文件');return}try{let im=JSON.parse(d);if(!Array.isArray(im))throw 0;if(!im.every(p=>p.siteName&&p.username&&p.password))throw 0;if(confirm('确定导入 '+im.length+' 条吗？')){passwords=passwords.concat(im);saveToStorage();renderPasswords();closeImportModal();showToast('已导入 '+im.length+' 条')}}catch(e){showToast('数据格式错误')}}
function saveToStorage(){localStorage.setItem('passwords',JSON.stringify(passwords))}
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('passwordModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById('exportModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeExportModal()});
document.getElementById('importModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeImportModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeExportModal();closeImportModal()}if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('searchInput').focus()}if((e.key==='n'||e.key==='N')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'&&!document.querySelector('.modal-overlay.active')){openModal('add')}});
renderPasswords();
</script>
</body>
</html>
