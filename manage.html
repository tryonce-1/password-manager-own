<style>
:root{--bg:#F7F8F7;--card:#FFFFFF;--line:#E6EAE7;--line2:#EEF1EE;--ink:#11181A;--sub:#5F6E63;--mut:#98A39B;--zed:#1348DC;--zed-d:#0E38B5;--green:#1D6B48;--danger:#C94F4F;--mono:ui-monospace,'JetBrains Mono',Menlo,monospace;--serif:'Noto Serif SC',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit','Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:0;bottom:0;left:50%;width:800px;max-width:94vw;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.09) 1px,transparent 1px) left 0 top 0/100% 100% no-repeat,linear-gradient(90deg,rgba(0,0,0,.09) 1px,transparent 1px) right 0 top 0/100% 100% no-repeat,repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 28px) left 0 top 0/9px 240px no-repeat,repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 28px) right 0 top 0/9px 240px no-repeat;mask-image:linear-gradient(180deg,#000 0,#000 240px,transparent 420px);-webkit-mask-image:linear-gradient(180deg,#000 0,#000 240px,transparent 420px)}
.wrap{max-width:760px;margin:0 auto;padding:28px 28px 80px;position:relative}
.wrap::before,.wrap::after{content:'';position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.09)}
.wrap::before{left:0}.wrap::after{right:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:0;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:32px;height:32px;border-radius:8px;background:#fff;border:1.5px solid var(--ink);display:grid;place-items:center;box-shadow:0 -2px 0 rgba(0,0,0,.12) inset}
.mark svg{width:17px;height:17px;fill:var(--ink)}
.brand h1{font-size:1.02rem;font-weight:600;letter-spacing:.2px}
.brand small{color:var(--mut);font-size:.74rem;font-family:var(--mono)}
.top-actions{display:flex;align-items:center;gap:8px}
.n{font-size:.78rem;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:7px 11px;border-radius:6px;font-family:var(--mono)}
.n b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--ink);transition:.15s;white-space:nowrap;box-shadow:0 -2px 0 rgba(0,0,0,.06) inset}
.btn:hover{border-color:#CBD5CD}
.btn:active{transform:translateY(1px);box-shadow:none}
.key{font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mut);background:var(--bg)}
.btn-zed{background:var(--zed);color:#fff;border-color:var(--zed);box-shadow:0 -2px 0 rgb(5,55,148) inset}
.btn-zed:hover{background:var(--zed-d)}
.btn-zed .key{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.12)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.bar{padding:14px 0;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:0}
.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 11px;min-height:40px;box-shadow:0 -2px 0 rgba(0,0,0,.04) inset}
.search:focus-within{border-color:var(--zed)}
.search svg{width:16px;height:16px;fill:var(--mut);flex-shrink:0}
#searchInput{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:.9rem;height:38px;color:var(--ink);min-width:0}
.hint{font-size:.76rem;color:var(--mut);margin:0;padding:12px 2px;font-family:var(--mono);display:flex;justify-content:space-between}
.password-list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.password-item{background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:13px 14px;display:flex;align-items:center;gap:12px;transition:.12s;position:relative}
.password-item:last-child{border-bottom:0}
.password-item::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--zed);opacity:0}
.password-item:hover{background:#F7F9F8}
.password-item:hover::before{opacity:1}
.favicon{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;background:#EEF2EF;color:var(--ink);font-weight:600;font-size:.95rem;flex-shrink:0;border:1px solid var(--line2)}
.password-item img{width:32px;height:32px;border-radius:7px;flex-shrink:0;background:#fff;border:1px solid var(--line2);object-fit:cover}
.password-info{flex:1;min-width:0}
.password-title{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.password-title a{color:inherit;text-decoration:none}
.password-title a:hover{color:var(--zed)}
.password-username{font-size:.79rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.password-meta{font-size:.7rem;color:var(--mut);margin-top:1px;font-family:var(--mono)}
.password-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{height:30px;min-width:30px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:inherit;font-size:.78rem;color:var(--sub);transition:.12s;box-shadow:0 -2px 0 rgba(0,0,0,.05) inset}
.icon-btn:hover{border-color:#CBD5CD;color:var(--ink)}
.copy-btn{background:var(--ink);border-color:var(--ink);color:#fff}
.copy-btn:hover{background:#000;color:#fff}
.icon-btn.danger:hover{color:var(--danger);border-color:#E8C4C4;background:#FFF7F7}
.empty{text-align:center;padding:54px 20px;color:var(--mut)}
.empty h3{color:var(--sub);margin:12px 0 4px;font-size:.98rem;font-weight:600}
.empty p{font-size:.84rem;margin-bottom:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;visibility:hidden;transition:.2s;padding:16px}
.modal-overlay.active{opacity:1;visibility:visible}
.modal{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;transform:translateY(8px);transition:.2s}
.modal-overlay.active .modal{transform:none}
.modal h2{font-size:1.02rem;margin-bottom:4px;font-weight:600}
.modal .sub{font-family:var(--mono);font-size:.72rem;color:var(--mut);margin-bottom:18px;letter-spacing:1px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.83rem;color:var(--sub);margin-bottom:6px}
.form-group input,.form-group textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:.92rem;background:#fff;color:var(--ink);transition:.15s}
.form-group input:focus,.form-group textarea:focus{outline:0;border-color:var(--zed)}
.form-group textarea{min-height:70px;resize:vertical}
.password-input-wrapper{position:relative}
.password-input-wrapper input{padding-right:42px}
.toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:0;border:0;cursor:pointer;padding:5px;color:var(--mut)}
.toggle-password svg{width:19px;height:19px;fill:currentColor}
.generator{background:var(--bg);border:1px solid var(--line2);border-radius:13px;padding:16px;margin-top:16px}
.generator h3{font-size:.9rem;margin-bottom:12px;color:var(--ink)}
.generated-password{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.95rem;text-align:center;word-break:break-all;margin-bottom:12px;min-height:48px;color:var(--ink)}
.length-slider{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.84rem;color:var(--sub)}
.length-slider input{flex:1;accent-color:var(--zed)}
.length-value{font-weight:700;color:var(--ink)}
.generator-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.checkbox-label{display:flex;align-items:center;gap:7px;font-size:.82rem;padding:7px 11px;background:#fff;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.checkbox-label input{display:none}
.checkbox-label span{width:15px;height:15px;border:1px solid #B9C4BC;border-radius:4px;display:grid;place-items:center}
.checkbox-label span svg{width:11px;height:11px;fill:#fff;opacity:0}
.checkbox-label input:checked+span{background:var(--zed);border-color:var(--zed)}
.checkbox-label input:checked+span svg{opacity:1}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1;justify-content:center;padding:11px}
.export-textarea{width:100%;height:150px;padding:11px;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:.78rem;margin-bottom:12px;resize:vertical}
.file-input-label{display:flex;align-items:center;justify-content:center;gap:8px;padding:28px 14px;background:var(--bg);border:1px dashed #CBD5CD;border-radius:12px;color:var(--sub);font-size:.86rem;margin-bottom:12px;cursor:pointer;position:relative}
.file-input-label svg{width:22px;height:22px;fill:currentColor}
.file-input-wrapper{position:relative}
.file-input-wrapper input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:.86rem;opacity:0;transition:.25s;z-index:99}
.toast.show{transform:translateX(-50%);opacity:1}

:root{

}

  mask-image:linear-gradient(180deg,#000 0,#000 190px,transparent 380px);

}
.wrap{
  max-width:960px;

}

}

}

<body>
<div class="wrap">
<div class="top">
<div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1.2 14.5-3.6-3.6 1.4-1.4 2.2 2.2 5.2-5.2 1.4 1.4-6.6 6.6z"/></svg></div><div><h1>密码管家</h1><small>vault · local</small></div></div>
<div class="top-actions"><div class="n">共 <b id="totalCount">0</b> 项</div><button class="btn" onclick="openExportModal()">导出 </button><button class="btn" onclick="openImportModal()">导入 </button></div>
</div>

<div class="bar">
<div class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="searchInput" placeholder="搜索网站、账号" oninput="filterPasswords()"><span class="key">/</span></div>
<button class="btn btn-zed" onclick="openModal('add')">新增 <span class="key">N</span></button>
</div>
<div class="hint"><span>ALL ITEMS</span><span id="listHint"></span></div>
<div class="password-list" id="passwordList"></div>
</div>
<div class="modal-overlay" id="passwordModal"><div class="modal">
<h2 id="modalTitle">新增密码</h2>
<div class="sub">VAULT — EDITOR</div>
<form id="passwordForm" onsubmit="savePassword(event)">
<input type="hidden" id="editIndex" value="-1">
<div class="form-group"><label>网站名称 *</label><input id="siteName" required placeholder="例如 Google"></div>
<div class="form-group"><label>网站链接</label><input id="url" placeholder="https://example.com"></div>
<div class="form-group"><label>账号 *</label><input id="username" required placeholder="用户名或邮箱"></div>
<div class="form-group"><label>密码 *</label><div class="password-input-wrapper"><input type="password" id="password" required placeholder="请输入密码"><button type="button" class="toggle-password" onclick="togglePasswordVisibility()"><svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></button></div></div>
<div class="form-group"><label>备注</label><textarea id="notes" placeholder="备注..."></textarea></div>
<div class="generator">
<h3>密码生成器</h3>
<div class="generated-password" id="generatedPassword">点击生成</div>
<div class="length-slider"><span>长度</span><input type="range" id="passwordLength" min="6" max="32" value="16" oninput="updateLengthDisplay()"><span class="length-value" id="lengthValue">16</span></div>
<div class="generator-options">
<label class="checkbox-label"><input type="checkbox" id="useNumbers" checked><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>数字</label>
<label class="checkbox-label"><input type="checkbox" id="useUppercase" checked><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>大写</label>
<label class="checkbox-label"><input type="checkbox" id="useLowercase" checked><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>小写</label>
<label class="checkbox-label"><input type="checkbox" id="useSpecial"><span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>符号</label>
</div>
<button type="button" class="btn" style="width:100%;justify-content:center" onclick="generatePassword()">生成随机密码</button>
</div>
<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-green">保存</button></div>
</form>
</div></div>
<div class="modal-overlay import-export-modal" id="exportModal"><div class="modal">
<h2>导出密码</h2>
<div class="sub">EXPORT — JSON</div>
<p style="color:var(--sub);margin-bottom:12px;font-size:.86rem">密码数据已下载，请妥善保存：</p>
<textarea class="export-textarea" id="exportData" readonly></textarea>
<div class="modal-actions"><button type="button" class="btn" onclick="copyExportData()">复制数据</button><button type="button" class="btn btn-dark" onclick="closeExportModal()">完成</button></div>
</div></div>
<div class="modal-overlay import-export-modal" id="importModal"><div class="modal">
<h2>导入密码</h2>
<div class="sub">IMPORT — JSON</div>
<p style="color:var(--sub);margin-bottom:12px;font-size:.86rem">请粘贴之前导出的密码数据：</p>
<textarea class="export-textarea" id="importData" placeholder="在此粘贴数据..."></textarea>
<div class="modal-actions"><button type="button" class="btn" onclick="closeImportModal()">取消</button><button type="button" class="btn btn-green" onclick="importPasswords()">导入</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
let passwords=JSON.parse(localStorage.getItem('passwords'))||[];
function getFaviconHtml(url,siteName){if(url){try{let d=(new URL(url)).hostname;return '<img src="https://www.google.com/s2/favicons?sz=64&domain='+d+'" alt="" onerror="this.style.display=\'none\'">'}catch(e){}}return '<div class="favicon">'+siteName.charAt(0).toUpperCase()+'</div>'}
function renderPasswords(){let list=document.getElementById('passwordList');let q=document.getElementById('searchInput').value.toLowerCase();let f=passwords.filter(p=>p.siteName.toLowerCase().includes(q)||p.username.toLowerCase().includes(q));document.getElementById('totalCount').textContent=passwords.length;document.getElementById('listHint').textContent=f.length+' 项';if(f.length===0){list.innerHTML='<div class="empty"><h3>'+(passwords.length===0?'还没有密码':'没有匹配结果')+'</h3><p>'+(passwords.length===0?'点击新增，添加第一条':'换个关键词试试')+'</p><button class="btn btn-zed" onclick="openModal(\'add\')">+ 新增密码</button></div>';return}
list.innerHTML=f.map((p,index)=>{let fav=getFaviconHtml(p.url||'',p.siteName);let name=p.url?'<a href="'+p.url+'" target="_blank">'+escapeHtml(p.siteName)+'</a>':escapeHtml(p.siteName);let notes=p.notes?'<div class="password-username">'+escapeHtml(p.notes.substring(0,30))+'</div>':'';return '<div class="password-item">'+fav+'<div class="password-info"><div class="password-title">'+name+'</div><div class="password-username">'+escapeHtml(p.username)+'</div>'+notes+'<div class="password-meta">'+(p.createdAt?escapeHtml(p.createdAt):'')+'</div></div><div class="password-actions"><button class="icon-btn copy-btn" onclick="copyPassword(this,\''+escapeHtml(p.password).replace(/\'/g,"\\'")+'\')">复制</button><button class="icon-btn" onclick="editPassword('+index+')">编辑</button><button class="icon-btn danger" onclick="deletePassword('+index+')">删除</button></div></div>'}).join('')}
function escapeHtml(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}
function filterPasswords(){renderPasswords()}
function openModal(mode,index=-1){let m=document.getElementById('passwordModal');let t=document.getElementById('modalTitle');let f=document.getElementById('passwordForm');if(mode==='add'){t.textContent='新增密码';f.reset();document.getElementById('editIndex').value=-1;document.getElementById('generatedPassword').textContent='点击生成'}else{t.textContent='编辑密码';let p=passwords[index];document.getElementById('editIndex').value=index;document.getElementById('siteName').value=p.siteName;document.getElementById('url').value=p.url||'';document.getElementById('username').value=p.username;document.getElementById('password').value=p.password;document.getElementById('notes').value=p.notes||'';document.getElementById('generatedPassword').textContent='点击生成'}m.classList.add('active')}
function closeModal(){document.getElementById('passwordModal').classList.remove('active')}
function savePassword(e){e.preventDefault();let i=parseInt(document.getElementById('editIndex').value);let n=new Date();let ds=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');let d={siteName:document.getElementById('siteName').value,url:document.getElementById('url').value,username:document.getElementById('username').value,password:document.getElementById('password').value,notes:document.getElementById('notes').value};if(i===-1){d.createdAt=ds;passwords.push(d);showToast('已添加')}else{d.createdAt=passwords[i].createdAt||ds;passwords[i]=d;showToast('已更新')}saveToStorage();renderPasswords();closeModal()}
function editPassword(i){openModal('edit',i)}
function deletePassword(i){if(confirm('确定删除这条记录吗？')){passwords.splice(i,1);saveToStorage();renderPasswords();showToast('已删除')}}
function copyPassword(a,b){let btn=null,pwd='';if(typeof a==='string'){pwd=a}else{btn=a;pwd=b}navigator.clipboard.writeText(pwd).then(()=>{showToast('已复制')}).catch(()=>showToast('复制失败'))}
function togglePasswordVisibility(){let i=document.getElementById('password');i.type=i.type==='password'?'text':'password'}
function generatePassword(){let len=parseInt(document.getElementById('passwordLength').value);let c='';if(document.getElementById('useNumbers').checked)c+='0123456789';if(document.getElementById('useUppercase').checked)c+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(document.getElementById('useLowercase').checked)c+='abcdefghijklmnopqrstuvwxyz';if(document.getElementById('useSpecial').checked)c+='!@#$%^&*()_+-=[]{}|;:,.<>?';if(!c){showToast('至少选一种字符');return}let s='';let a=new Uint32Array(len);crypto.getRandomValues(a);for(let k=0;k<len;k++)s+=c[a[k]%c.length];document.getElementById('generatedPassword').textContent=s;document.getElementById('password').value=s}
function updateLengthDisplay(){document.getElementById('lengthValue').textContent=document.getElementById('passwordLength').value}
function openExportModal(){if(!passwords.length){showToast('没有可导出的数据');return}document.getElementById('exportData').value='';document.getElementById('exportModal').classList.add('active');let b=new Blob([JSON.stringify(passwords,null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let x=document.createElement('a');x.href=u;x.download='passwords.json';document.body.appendChild(x);x.click();setTimeout(()=>{document.body.removeChild(x);URL.revokeObjectURL(u)},100)}
function closeExportModal(){document.getElementById('exportModal').classList.remove('active')}
function copyExportData(){showToast('请使用下载的json文件')}
function openImportModal(){document.getElementById('importData').value='';document.getElementById('importModal').classList.add('active');if(!document.getElementById('importFileInput')){let w=document.createElement('div');w.className='file-input-wrapper';w.innerHTML='<label class="file-input-label">选择 json 文件导入<input type="file" id="importFileInput" accept="application/json"></label>';let m=document.getElementById('importModal').querySelector('.modal');m.insertBefore(w,m.querySelector('.export-textarea'));document.getElementById('importFileInput').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){document.getElementById('importData').value=ev.target.result};r.readAsText(f)})}}
function closeImportModal(){document.getElementById('importModal').classList.remove('active')}
function importPasswords(){let d=document.getElementById('importData').value.trim();if(!d){showToast('请粘贴数据或选择文件');return}try{let im=JSON.parse(d);if(!Array.isArray(im))throw 0;if(!im.every(p=>p.siteName&&p.username&&p.password))throw 0;if(confirm('确定导入 '+im.length+' 条吗？')){passwords=passwords.concat(im);saveToStorage();renderPasswords();closeImportModal();showToast('已导入 '+im.length+' 条')}}catch(e){showToast('数据格式错误')}}
function saveToStorage(){localStorage.setItem('passwords',JSON.stringify(passwords))}
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('passwordModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById('exportModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeExportModal()});
document.getElementById('importModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeImportModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeExportModal();closeImportModal()}if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('searchInput').focus()}if((e.key==='n'||e.key==='N')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'&&!document.querySelector('.modal-overlay.active')){openModal('add')}});
renderPasswords();
</script>
</body>
